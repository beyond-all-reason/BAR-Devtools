name: Dev Image

# Publishes two images to GHCR:
#
#   bar-dev        docker/dev.Containerfile       the distrobox toolchain
#   bar-migration  docker/migration.Containerfile bar-dev + prebuilt codemod
#
# The Containerfile is already the canonical dependency list for local
# development. Publishing it means CI can run *in* that list rather than
# reproducing a subset of it in YAML -- which is how the toolchain versions in
# a workflow drift away from the ones contributors actually have, quietly, until
# a formatter emits something nobody else emits.
#
# Consumer: the Bulk Migration action in the BAR repo runs its whole job in
# bar-migration.
#
# Both packages must be **public** for other repositories to pull them without
# credentials. That is a one-time setting after the first push:
# Packages -> <name> -> Package settings -> Change visibility.

on:
  push:
    branches: [master]
    paths:
      - docker/dev.Containerfile
      - docker/migration.Containerfile
      - bar-lua-codemod/**
      - .github/workflows/dev-image.yml
  pull_request:
    paths:
      - docker/dev.Containerfile
      - docker/migration.Containerfile
      - bar-lua-codemod/**
      - .github/workflows/dev-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Pull requests build but do not publish: the point is to catch a
      # Containerfile that no longer builds, before it becomes :latest.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dev.Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/bar-dev:latest
            ghcr.io/${{ github.repository_owner }}/bar-dev:${{ github.sha }}
          cache-from: type=gha,scope=bar-dev
          cache-to: type=gha,mode=max,scope=bar-dev

  migration:
    needs: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a push, build on the dev image this run just published, so the two
      # are the same vintage by construction. A pull request has nothing
      # published to point at, so it validates against the current :latest --
      # enough to catch a Containerfile or a codemod that stopped compiling.
      - name: Resolve base image
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            tag=latest
          else
            tag="${{ github.sha }}"
          fi
          echo "ref=ghcr.io/${{ github.repository_owner }}/bar-dev:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/migration.Containerfile
          build-args: BASE=${{ steps.base.outputs.ref }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/bar-migration:latest
            ghcr.io/${{ github.repository_owner }}/bar-migration:${{ github.sha }}
          cache-from: type=gha,scope=bar-migration
          cache-to: type=gha,mode=max,scope=bar-migration
