[package]
name = "bar-mission-kit"
version = "0.1.0"
edition = "2021"

[dependencies]
emmylua_parser = "0.28"
glob = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dioxus = { version = "0.6", default-features = false, features = ["macro", "html", "signals"] }
dioxus-ssr = "0.6"
