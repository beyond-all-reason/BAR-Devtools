<!DOCTYPE html>
<!-- Browser terminal for the view artifact, served by bar-mission-kit at /.
     Same server-rendered form the game and VS Code consume; this page is
     just another stylesheet and an intent pipe. -->
<html>
<head>
<meta charset="utf-8"/>
<title>Campaign Editor</title>
<style>
	body { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; margin: 0; padding: 12px;
		background: #0a0e14; color: #d5dde7; }
	#panel { max-width: 560px; margin: 0 auto; background: linear-gradient(#111823, #0d1219);
		border: 1px solid #223040; border-radius: 10px; padding: 16px 18px;
		box-shadow: 0 12px 34px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.07); }
	h1 { font-size: 1.1em; font-weight: 600; color: #fff; margin: 0 0 12px; padding-bottom: 10px;
		border-bottom: 1px solid #1d2938; }
	.me-file { color: #55677a; font-size: 0.75em; margin: 8px 0 4px; }
	.me-group { color: #e8c884; font-size: 0.85em; margin: 12px 0 4px; }
	/* Summary: KPI row + one part-to-whole bar. Series hues are the validated
	   dark categorical slots 1-2; labels/values stay in text ink so identity is
	   carried by the dots, not the type. */
	.me-summary { margin: 2px 0 10px; }
	.me-stats { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 6px; }
	.me-stat { display: flex; align-items: baseline; gap: 5px; background: transparent;
		border: 1px solid transparent; border-radius: 6px; padding: 3px 7px; cursor: pointer;
		font: inherit; }
	.me-stat:hover { background: #16202c; border-color: #2c3b4d; }
	.me-stat-dot { width: 7px; height: 7px; border-radius: 4px; align-self: center; }
	.me-stat-label { color: #8fa3b8; font-size: 0.72em; }
	.me-stat-value { color: #e8eef6; font-weight: 600; font-size: 0.9em; }
	.me-propbar { display: flex; height: 6px; }
	.me-propseg { height: 6px; border-radius: 3px; }
	.me-propseg + .me-propseg { margin-left: 2px; }   /* 2px surface gap */
	.me-series-1 { background: #3987e5; }
	.me-series-2 { background: #d95926; }
	/* Module explorer: one row per module publishing a marked DSL surface. */
	.me-module { padding: 6px 0; border-bottom: 1px solid #16202c; }
	.me-module-head { display: flex; align-items: baseline; gap: 8px; }
	.me-module-name { color: #cfe4ff; font-size: 0.85em; }
	.me-module-desc { color: #55677a; font-size: 0.7em; }
	.me-module-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 4px; }
	.me-module-key { color: #55677a; font-size: 0.65em; width: 62px; flex: 0 0 auto; }
	.me-chip { background: #16283c; border: 1px solid #33517a; color: #8fbcff;
		border-radius: 9px; padding: 1px 7px; font-size: 0.68em; }
	.me-chip-mode { background: #33230e; border-color: #6b4a1e; color: #ffb45e; }
	.me-chip-req { background: #1c242e; border-color: #3a4754; color: #97a5b4; }


	.me-card { background: linear-gradient(#16202c, #101720); border: 1px solid #223040;
		border-left: 3px solid #4f8ce0; border-radius: 8px; margin: 8px 0; padding: 10px 12px;
		box-shadow: 0 3px 10px rgba(0,0,0,0.3); }
	.me-card-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
	.me-card-title { color: #4c5d70; font-size: 0.68em; margin-right: auto; }
	.me-card-head .me-button { padding: 0 7px; font-size: 0.7em; }
	/* Single-row step grammar: fixed badge column | sentence | status | tools.
	   Sentences wrap inside their column; tools appear on hover. */
	.me-step { display: flex; align-items: baseline; gap: 8px; margin: 3px 0; }
	.me-step-verb { flex: 0 0 auto; min-width: 34px; text-align: center; font-size: 0.6em; border-radius: 4px; padding: 2px 7px;
		letter-spacing: 0.06em; align-self: flex-start; margin-top: 4px; }
	.me-verb-cond { background: #16283c; border: 1px solid #33517a; color: #8fbcff; }
	.me-verb-effect { background: #33230e; border: 1px solid #6b4a1e; color: #ffb45e; }
	.me-verb-mod { background: #1c242e; border: 1px solid #3a4754; color: #97a5b4; }
	.me-step-body { flex: 1 1 auto; min-width: 0; line-height: 1.85; }
	.me-step-tools { flex: 0 0 auto; opacity: 0; transition: opacity 0.12s; }
	.me-step:hover .me-step-tools { opacity: 1; }
	.me-verb { color: #82aaff; } .me-lit { color: #f6c177; } .me-ref { color: #9fd3a4; }
	.me-opaque { color: #e06c75; margin: 4px 0; }
	/* Token controls: values read as part of the sentence, edit on focus. */
	.me-input, .me-select { background: transparent; border: none; border-bottom: 1px dashed #33517a;
		border-radius: 0; color: #ffd08a; padding: 0 2px; font-size: 1em; }
	.me-input:focus { outline: none; border-bottom: 1px solid #6ea8e8; background: rgba(110,168,232,0.08); }
	.me-input { width: 110px; } .me-input-num { width: 30px; text-align: center; }
	.me-select { color: #9fd3a4; max-width: 100%; cursor: pointer; appearance: none; -webkit-appearance: none;
		text-overflow: ellipsis; }
	/* Slot controls size to their content, not to the row: a unit name is long,
	   a team role is one word. */
	.me-select-unit { max-width: 15em; }
	.me-select-enum { max-width: 7em; }
	.me-button { background: rgba(255,255,255,0.04); border: 1px solid #2c3b4d; border-radius: 5px;
		color: #9fb3c8; padding: 3px 11px; font-size: 0.8em; cursor: pointer; }
	.me-button:hover { background: #22303f; border-color: #4c6784; color: #fff; }
	.me-button img { display: none; }
	.me-swap-btn::after { content: "\21bb"; }
	.me-x { color: #d98a92; border-color: #4a2c31; }
	.me-x:hover { background: #58242b; border-color: #8a4a52; color: #ffd3d7; }
	.me-add-row { margin-top: 8px; padding-top: 8px; border-top: 1px solid #1c2836; }
	.me-add-btn { color: #7fa9d8; border-color: #2c405a; background: rgba(79,140,224,0.05); }
	#modal { display: none; position: fixed; inset: 0; background: rgba(5,8,12,0.8); }
	.modal-box { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); width: 380px;
		background: linear-gradient(#1a2431, #10161d); border: 1px solid #34455a; border-radius: 8px;
		padding: 12px 14px; box-shadow: 0 14px 40px rgba(0,0,0,0.7); }
	#modal-title { color: #fff; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #1d2938; }
	.me-modal-group { color: #e8c884; font-size: 0.7em; margin: 10px 0 3px; }
	.me-modal-row { padding: 6px 9px; border-radius: 5px; cursor: pointer; }
	.me-modal-row:hover { background: #2c4158; color: #fff; }
	#hint { color: #55677a; }
	#footer { margin-top: 10px; padding-top: 8px; border-top: 1px solid #1d2938; font-size: 0.7em; color: #4c5d70; }
	.me-live { margin-left: 8px; padding: 2px 9px; border-radius: 9px; font-size: 0.8em; font-weight: 600;
		white-space: nowrap; background: #1b3a5e; border: 1px solid #4f8ce0; color: #b8d6ff;
		box-shadow: 0 0 6px rgba(79,140,224,0.35); }
	.me-live.done { background: #17452a; border-color: #3fae60; color: #9df0b6;
		box-shadow: 0 0 6px rgba(127,215,154,0.4); }
	.me-live.tick { animation: me-live-tick 0.6s ease-out; }
	@keyframes me-live-tick {
		0% { box-shadow: 0 0 0 3px rgba(143,188,255,0.6); }
		100% { box-shadow: 0 0 6px rgba(79,140,224,0.35); }
	}
	body.live-stale .me-live { opacity: 0.35; box-shadow: none; }

	/* Final shape: one flat card, collapsible sections. */
	.me-section { border-top: 1px solid #1d2938; margin-top: 4px; }
	.me-section:first-child { border-top: 0; margin-top: 0; }
	.me-section-head { display: flex; align-items: center; gap: 7px; width: 100%; background: none; border: none;
		color: #8fa3b8; font-size: 0.72em; letter-spacing: 0.14em; text-transform: uppercase;
		padding: 10px 2px 8px; cursor: pointer; }
	.me-section-head:hover { color: #cfe4ff; }
	.me-section-title { flex: 1; text-align: left; }
	.me-section-hint { color: #4c5d70; letter-spacing: 0; text-transform: none; }
	.me-caret { display: inline-block; transition: transform 0.12s; }
	.me-caret::before { content: "▾"; }
	.me-section.collapsed .me-caret { transform: rotate(-90deg); }
	.me-section.collapsed .me-section-body { display: none; }
	/* triggers flatten from boxes to left-ruled groups inside the one card */
	.me-card { background: none; border: none; border-left: 2px solid #2c3b4d; border-radius: 0;
		box-shadow: none; margin: 8px 0; padding: 0 0 2px 10px; }
	.me-card-head { margin-bottom: 2px; }
	.me-card-title { font-size: 0.68em; }
	.me-card-x { opacity: 0; transition: opacity 0.12s; }
	.me-card:hover .me-card-x { opacity: 1; }
	#live-banner { display: none; font-size: 0.72em; color: #8a9aac; padding: 4px 2px 0; }
	body.live-idle #live-banner { display: block; }
	body.live-idle .me-live { opacity: 0.35; }
	/* The navigable path: missions ▸ current. */
	.me-crumb { display: flex; align-items: center; gap: 6px; padding: 2px 0 6px; font-size: 0.82em; }
	.me-crumb-root { background: none; border: none; padding: 0; font-size: 1em; color: #6f9fd8; }
	button.me-crumb-root { cursor: pointer; }
	button.me-crumb-root:hover { color: #cfe4ff; text-decoration: underline; }
	.me-crumb-sep::before { content: "\25b8"; color: #4c5d70; }
	.me-crumb-here { color: #e4ecf5; font-weight: 600; }
	.me-mission-list { margin: 0 0 8px; padding: 4px; background: rgba(79,140,224,0.05);
		border: 1px solid #223040; border-radius: 6px; }
	.me-mission-list.collapsed { display: none; }
	.me-module-list.collapsed { display: none; }
	.me-hidden { display: none; }
	.me-mission-row { display: block; width: 100%; text-align: left; background: none; border: none;
		border-radius: 5px; color: #9fb3c8; padding: 5px 9px; font-size: 0.85em; cursor: pointer; }
	.me-mission-row:hover { background: #2c4158; color: #fff; }
	.me-mission-current { color: #e4ecf5; background: rgba(79,140,224,0.12); }
	.me-noun-group { color: #55677a; font-size: 0.68em; letter-spacing: 0.12em; margin: 10px 0 3px; }
	.me-noun { display: flex; align-items: center; justify-content: space-between; padding: 3px 4px; border-radius: 4px; }
	.me-noun-name { color: #c6d2df; }
	.me-noun-open { cursor: pointer; }
	.me-noun-open:hover { background: #1a2634; }
	.me-step-live { flex: 0 0 auto; }
	.me-jump { cursor: pointer; }
	.me-jump:hover { color: #cfe4ff; text-decoration: underline; }

	/* Embedded (?embed=1, the VS Code sidebar): the host provides the chrome. */
	body.embed { padding: 4px 6px; }
	body.embed #panel { max-width: none; border: 0; border-radius: 0; box-shadow: none;
		background: transparent; padding: 2px; }
	body.embed h1, body.embed #footer { display: none; }

	/* Narrow container: each step wraps to two deliberate rows —
	   [badge ........ chip tools] then the sentence at full width, with the
	   unit dropdown scaling to the whole line. */
	@media (max-width: 520px) {
		.me-input { width: 90px; }
		.me-card-head { display: block; position: relative; padding-right: 26px; }
		.me-card-head .me-x { position: absolute; right: 0; top: 0; }
	}
</style>
</head>
<body>
<div id="panel">
	<h1>Campaign Editor</h1>
	<div id="hint">Waiting for bar-mission-kit serve to write the view artifact…</div>
	<div id="status"></div>
	<div id="live-banner">Mission not armed — values go live once it runs in-game.</div>
	<div id="content"></div>
	<div id="footer">The .lua file is the source of truth — this form and your IDE are two views over it.</div>
</div>
<div id="modal"><div class="modal-box">
	<div id="modal-title"></div>
	<div id="modal-rows"></div>
	<button id="modal-cancel" class="me-button">Cancel</button>
</div></div>
<script>
	if (new URLSearchParams(location.search).has("embed")) {
		document.body.classList.add("embed");
	}
	const DEBOUNCE_MS = 800;
	let view = null;
	let lastGeneration = null;
	const pending = new Map();

	const $ = (id) => document.getElementById(id);

	function isEditing() {
		const active = document.activeElement;
		return (active && $("content").contains(active)) || pending.size > 0;
	}

	async function poll() {
		try {
			const response = await fetch("/view");
			if (!response.ok) return;
			const fresh = await response.json();
			$("hint").style.display = "none";
			if (fresh.generation !== lastGeneration && !isEditing()) {
				lastGeneration = fresh.generation;
				view = fresh;
				$("content").innerHTML = fresh.form;
				applySectionStates();
			}
			const statusResponse = await fetch("/status");
			if (statusResponse.ok) {
				const status = await statusResponse.json();
				$("status").innerHTML = status.ok ? "" : '<div class="me-opaque"></div>';
				if (!status.ok) $("status").firstChild.textContent = status.message;
			}
		} catch {
			$("hint").style.display = "block";
		}
	}
	setInterval(poll, 500);
	poll();

	// Live game state: patch [data-live] chips in place — no re-render, no
	// focus loss. Chips dim when the game stops publishing.
	async function pollState() {
		let state;
		try {
			const response = await fetch("/state");
			if (!response.ok) return;
			state = await response.json();
		} catch {
			return;
		}
		const stale = state.t > 0 && Date.now() / 1000 - state.t > 8;
		document.body.classList.toggle("live-stale", stale);
		document.body.classList.toggle("live-idle", !stale && state.armed === false);
		for (const el of document.querySelectorAll("[data-live]")) {
			const value = state.values && state.values[el.dataset.live];
			if (!value) continue;
			if (el.textContent !== value.text) {
				el.textContent = value.text;
				el.classList.remove("tick");
				void el.offsetWidth; // restart the animation on rapid updates
				el.classList.add("tick");
			}
			el.classList.toggle("done", value.state === "done");
			if (typeof value.pct === "number") {
				const fill = value.state === "done" ? "rgba(127,215,154,0.5)" : "rgba(79,140,224,0.45)";
				el.style.background = `linear-gradient(90deg, ${fill} ${value.pct * 100}%, transparent 0)`;
			}
		}
	}
	setInterval(pollState, 1000);

	async function postEdit(intent) {
		await fetch("/edit", {
			method: "POST",
			headers: { "content-type": "application/json" },
			body: JSON.stringify(intent),
		});
		lastGeneration = null;
	}

	function fieldIntent(el, newText) {
		return {
			file: el.dataset.file,
			start: +el.dataset.start,
			end: +el.dataset.end,
			new_text: el.dataset.quote === "1" ? '"' + newText + '"' : newText,
			base_hash: el.dataset.hash,
		};
	}

	$("content").addEventListener("change", (event) => {
		const el = event.target;
		if (!el.dataset || el.dataset.start === undefined) return;
		const key = el.dataset.file + ":" + el.dataset.start;
		clearTimeout(pending.get(key));
		const delay = el.tagName === "SELECT" ? 0 : DEBOUNCE_MS;
		pending.set(key, setTimeout(() => {
			pending.delete(key);
			postEdit(fieldIntent(el, el.value));
		}, delay));
	});

	// Collapse choices survive re-renders. ?focus=<section> scopes the page to
	// one section (the module editor view); the rest stay out of the way until
	// the reader opens them.
	const collapsedSections = new Map();
	// Two editors over one page: the mission editor owns triggers and units,
	// the module editor owns nouns and modules. ?focus= names the view; each
	// keeps only its own sections and summary. A dashboard tile pointing at
	// the other view's section still reveals it — the tiles are the crossing.
	const VIEW_SECTIONS = { mission: ["mission", "units"], modules: ["nouns", "modules"] };
	const view = new URLSearchParams(location.search).get("focus") || "mission";
	const mine = VIEW_SECTIONS[view] || null;
	function applySectionStates() {
		for (const summaryEl of document.querySelectorAll("[data-view]")) {
			summaryEl.classList.toggle("me-hidden", mine !== null && summaryEl.dataset.view !== view);
		}
		for (const sectionEl of document.querySelectorAll(".me-section")) {
			const key = sectionEl.dataset.section;
			if (mine && !mine.includes(key) && !collapsedSections.has(key)) {
				sectionEl.classList.add("me-hidden");
				continue;
			}
			sectionEl.classList.remove("me-hidden");
			if (collapsedSections.has(key)) {
				sectionEl.classList.toggle("collapsed", collapsedSections.get(key));
			}
		}
	}

	$("content").addEventListener("click", (event) => {
		// Dashboard tile -> open that section and bring it into view.
		const open = event.target.closest("[data-open-section]");
		if (open) {
			const key = open.dataset.openSection;
			const target = document.querySelector(`.me-section[data-section="${key}"]`);
			if (target) {
				target.classList.remove("collapsed", "me-hidden");
				collapsedSections.set(key, false);
				target.scrollIntoView({ behavior: "smooth", block: "start" });
			}
			return;
		}
		// The module picker: toggle the list, or jump to a module's row.
		const pick = event.target.closest("[data-select-module]");
		if (pick) {
			const row = document.querySelector(`.me-module[data-module="${pick.dataset.selectModule}"]`);
			if (row) row.scrollIntoView({ behavior: "smooth", block: "start" });
			document.querySelector("[data-module-list]")?.classList.add("collapsed");
			return;
		}
		const nav = event.target.closest('[data-nav="modules"]');
		if (nav) {
			document.querySelector("[data-module-list]")?.classList.toggle("collapsed");
			return;
		}
		const toggle = event.target.closest("[data-toggle]");
		if (toggle) {
			const sectionEl = toggle.closest(".me-section");
			sectionEl.classList.toggle("collapsed");
			collapsedSections.set(sectionEl.dataset.section, sectionEl.classList.contains("collapsed"));
			return;
		}
		const nav = event.target.closest("[data-nav]");
		if (nav) {
			const list = document.querySelector("[data-mission-list]");
			if (list) list.classList.toggle("collapsed");
			return;
		}
		const pick = event.target.closest("[data-select-mission]");
		if (pick) {
			fetch("/select_mission", {
				method: "POST",
				headers: { "content-type": "application/json" },
				body: JSON.stringify({ name: pick.dataset.selectMission }),
			});
			lastGeneration = null; // the re-scope renders as the next generation
			return;
		}
		const jump = event.target.closest("[data-open-file]");
		if (jump) {
			fetch("/open", {
				method: "POST",
				headers: { "content-type": "application/json" },
				body: JSON.stringify({ file: jump.dataset.openFile, line: +jump.dataset.openLine || 1 }),
			});
			return;
		}
		const remove = event.target.closest('[data-op="remove"]');
		if (remove) {
			postEdit({
				file: remove.dataset.file,
				start: +remove.dataset.removeStart,
				end: +remove.dataset.removeEnd,
				new_text: "",
				base_hash: remove.dataset.hash,
			});
			return;
		}
		const swap = event.target.closest("[data-pool]");
		if (swap) return openModal("swap_" + swap.dataset.pool, swap);
		const add = event.target.closest("[data-add]");
		if (add) return openModal(add.dataset.add === "statement" ? "add_statement" : "add_step", add);
	});

	function positionFor(kind, opener) {
		if (kind === "swap") return [+opener.dataset.swapStart, +opener.dataset.swapEnd];
		if (kind === "trigger") return [+opener.dataset.insert, +opener.dataset.insert];
		if (kind === "andwhen") return [+opener.dataset.insertCond, +opener.dataset.insertCond];
		return [+opener.dataset.insertEffect, +opener.dataset.insertEffect];
	}

	function openModal(key, opener) {
		const payload = view && view.modals && view.modals[key];
		if (!payload) return;
		$("modal-title").textContent = payload.title;
		const rowsEl = $("modal-rows");
		rowsEl.innerHTML = "";
		for (const row of payload.rows) {
			const div = document.createElement("div");
			div.className = row.kind === "group" ? "me-modal-group" : "me-modal-row";
			div.textContent = row.label;
			if (row.kind !== "group") {
				div.addEventListener("click", () => {
					const [start, end] = positionFor(row.kind, opener);
					postEdit({
						file: opener.dataset.file,
						start, end,
						new_text: row.new_text,
						base_hash: opener.dataset.hash,
					});
					$("modal").style.display = "none";
				});
			}
			rowsEl.appendChild(div);
		}
		$("modal").style.display = "block";
	}
	$("modal-cancel").addEventListener("click", () => { $("modal").style.display = "none"; });
</script>
</body>
</html>
